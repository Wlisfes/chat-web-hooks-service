name: chat-web-service

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "30"

services:
  hooks-service:
    image: ${IMAGE:?IMAGE is required}
    container_name: chat-web-hooks-service
    restart: unless-stopped
    logging: *default-logging
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5110
      TZ: ${TZ:-Asia/Shanghai}
    # Observe 经 Docker 网络调用 chat-web-hooks-service:5110；主机只绑定 127.0.0.1 用于健康检查和 Swagger。
    ports:
      - '${HOST_BIND_IP:-127.0.0.1}:5110:5110'
    expose:
      - '5110'
    networks:
      - infrastructure
    stop_grace_period: 20s

networks:
  infrastructure:
    external: true
    name: ${DOCKER_NETWORK:-chat-web-infrastructure}
